# Expects sibling checkouts of dtnpm-core (`../dtnpm-core`) and hardy (`../../hardy`).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    name: Workspace Tests (LTP + KISS CLA) & SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hardy DTN workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm
      - name: Checkout dtnpm-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtn-postmaster/dtnpm-core
      - name: Checkout dtnpm-cla-ltp-kiss
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dtn-postmaster/dtnpm-cla-ltp-kiss
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Cache protoc
        id: protoc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/protoc
          key: protoc-29.3-linux-x86_64
      - name: Install protoc (cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dtn-postmaster/dtnpm-cla-ltp-kiss
      - name: Formatting check
        working-directory: dtn-postmaster/dtnpm-cla-ltp-kiss
        run: cargo fmt --all -- --check
      - name: Strict Clippy check (production targets)
        working-directory: dtn-postmaster/dtnpm-cla-ltp-kiss
        run: cargo clippy --workspace --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::panic
      - name: Run workspace tests (excluding fuzz targets)
        working-directory: dtn-postmaster/dtnpm-cla-ltp-kiss
        run: cargo test --workspace --exclude dtnpm-cla-ltp-kiss-fuzz --exclude hardy-ltp-fuzz
      - name: Generate CycloneDX / SPDX SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dtn-postmaster/dtnpm-cla-ltp-kiss
          output-file: dtn-postmaster/dtnpm-cla-ltp-kiss/sbom.json
          format: cyclonedx-json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-dtnpm-cla-ltp-kiss
          path: dtn-postmaster/dtnpm-cla-ltp-kiss/sbom.json

  security-audit:
    name: Security & License Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hardy DTN workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm
      - name: Checkout dtnpm-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtn-postmaster/dtnpm-core
      - name: Checkout dtnpm-cla-ltp-kiss
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dtn-postmaster/dtnpm-cla-ltp-kiss
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Cache protoc
        id: protoc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/protoc
          key: protoc-29.3-linux-x86_64
      - name: Install protoc (cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dtn-postmaster/dtnpm-cla-ltp-kiss
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tool: cargo-audit, cargo-deny, gitleaks
      - name: Run strict security checks
        working-directory: dtn-postmaster/dtnpm-cla-ltp-kiss
        run: ./scripts/check-security.sh --strict

  code-coverage:
    name: Code Coverage (LCOV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hardy DTN workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm
      - name: Checkout dtnpm-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtn-postmaster/dtnpm-core
      - name: Checkout dtnpm-cla-ltp-kiss
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dtn-postmaster/dtnpm-cla-ltp-kiss
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache protoc
        id: protoc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/protoc
          key: protoc-29.3-linux-x86_64
      - name: Install protoc (cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dtn-postmaster/dtnpm-cla-ltp-kiss
      - uses: taiki-e/install-action@9299c56f1fb893650f348425bb02c3acf492ebd2 # cargo-llvm-cov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate LCOV coverage report
        working-directory: dtn-postmaster/dtnpm-cla-ltp-kiss
        run: ./scripts/check-coverage.sh --lcov
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-dtnpm-cla-ltp-kiss
          path: dtn-postmaster/dtnpm-cla-ltp-kiss/lcov.info

  fuzz-smoke-tests:
    name: Fuzzing Smoke Tests (30s per target)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hardy DTN workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm
      - name: Checkout dtnpm-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtn-postmaster/dtnpm-core
      - name: Checkout dtnpm-cla-ltp-kiss
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dtn-postmaster/dtnpm-cla-ltp-kiss
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - name: Cache protoc
        id: protoc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/protoc
          key: protoc-29.3-linux-x86_64
      - name: Install protoc (cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422 # cargo-fuzz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fuzz targets (smoke tests)
        working-directory: dtn-postmaster/dtnpm-cla-ltp-kiss
        run: |
          cargo fuzz run --fuzz-dir fuzz cla_packet -- -max_total_time=30
          cargo fuzz run --fuzz-dir ltp/fuzz engine_ops -- -max_total_time=30
          cargo fuzz run --fuzz-dir ltp/fuzz sdnv_kiss -- -max_total_time=30
          cargo fuzz run --fuzz-dir ltp/fuzz segment_decode -- -max_total_time=30
