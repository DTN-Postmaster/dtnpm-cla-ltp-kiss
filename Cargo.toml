[workspace]
resolver = "2"
members = [
    ".",
    "ltp",
    "ltp/fuzz",
    "fuzz",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtn-postmaster/dtnpm-cla-ltp-kiss"

[package]
name = "dtnpm-cla-ltp-kiss"
description = "An LTP (RFC 5326 / RFC 7122) and KISS convergence layer for Hardy BPv7"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dtn", "bpv7", "convergence-layer", "ltp", "kiss"]
categories = ["network-programming"]

[lib]
name = "dtnpm_cla_ltp_kiss"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "dtnpm-cla-ltp-kiss"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
serde = ["dep:serde", "hardy-bpa/serde", "hardy-bpv7/serde", "hardy-ltp/serde", "dep:humantime"]
cli = ["serde", "dep:clap", "dep:yaml_serde", "dep:toml", "dep:tracing-subscriber", "dep:anyhow", "dtnpm-core/transport-grpc"]
instrument = ["tracing/attributes"]

[dependencies]
hardy-async = { version = "0.2", path = "../../hardy/async" }
hardy-bpa = { version = "0.2", path = "../../hardy/bpa" }
hardy-bpv7 = { version = "0.6", path = "../../hardy/bpv7" }
hardy-ltp = { version = "0.2", path = "ltp" }
dtnpm-core = { version = "0.2", path = "../dtnpm-core", default-features = false }
tokio = { version = "1", features = ["macros", "net", "sync", "time", "rt", "io-util", "signal"] }
tracing = { version = "0.1", default-features = false }
thiserror = "2"
bytes = "1"
serde = { version = "1", features = ["derive"], optional = true }
humantime = { version = "2", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
yaml_serde = { version = "0.10", optional = true }
toml = { version = "0.8", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
sha2 = "0.10"
yaml_serde = "0.10"
